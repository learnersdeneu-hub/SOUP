<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SOUP Companion</title>
<style>
  :root { --navy: #1E3A5F; --paper: #FAFAFA; --hair: #E5E5E5; --ink: #1C1D1F; --mute: #6B6E73; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 46px; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .toolbar { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 10px; background: var(--navy); -webkit-app-region: drag; }
  .toolbar button { -webkit-app-region: no-drag; }
  .navbtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; border: none; background: rgba(255,255,255,.12); color: #fff; font-size: 14px; cursor: pointer; }
  .navbtn:hover { background: rgba(255,255,255,.2); }
  .navbtn:disabled { opacity: .4; cursor: default; }
  .brand { color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .06em; padding: 0 6px; flex-shrink: 0; }
  .urlbar { flex: 1; -webkit-app-region: no-drag; }
  .urlbar input { width: 100%; height: 28px; border-radius: 8px; border: none; padding: 0 12px; font-size: 12.5px; outline: none; background: rgba(255,255,255,.92); color: #1C1D1F; }
  .urlbar input:focus { background: #fff; }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="brand">SOUP</span>
    <button class="navbtn" id="back" title="Back">&#8592;</button>
    <button class="navbtn" id="forward" title="Forward">&#8594;</button>
    <button class="navbtn" id="reload" title="Reload">&#8635;</button>
    <button class="navbtn" id="home" title="Home">&#8962;</button>
    <div class="urlbar"><input id="url" type="text" placeholder="Go to a university, visa or accommodation site..." /></div>
  </div>
  <script src="shell.js"></script>
</body>
</html>
